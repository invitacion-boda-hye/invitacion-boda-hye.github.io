name: Publicar invitación en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/**'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto público mínimo
        run: |
          mkdir -p public
          cp index.html public/
          cp -R admin assets css js public/
          touch public/.nojekyll

      - name: Verificar límite y referencias del artefacto
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/js/rsvp-config.js
          test -f public/assets/musica.mp3
          ! find public -type f \( -name '*.sql' -o -name '*.env' -o -name '.env.*' -o -name '*.log' -o -name '*.zip' -o -name '*.tar' -o -name '*.tgz' \) -print -quit | grep -q .
          ! find public -type d \( -name supabase -o -name backups -o -name tests -o -name pruebas -o -name .git \) -print -quit | grep -q .
          grep -Fq 'https://invitacion-boda-hye.github.io/' public/index.html

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
