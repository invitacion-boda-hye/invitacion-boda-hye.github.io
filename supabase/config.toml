# La función pública no requiere JWT porque los invitados no crean una cuenta.
# Aun así, valida en servidor el token familiar aleatorio, su hash, vigencia,
# límite de solicitudes y todas las reglas de capacidad antes de leer o guardar.
# La función administrativa exige JWT y además comprueba la fila rsvp_admins.

[functions.public-rsvp]
verify_jwt = false

[functions.admin-rsvp]
verify_jwt = true
