<body><main class="album"><div class="ornament" aria-hidden="true">✳</div><h1>Comparte tus fotos con nosotros</h1><p>Si durante la celebración tomas alguna foto, nos encantaría tenerla.</p><p>Aquí puedes compartir las fotos que hayas tomado durante nuestro matrimonio.</p><form id="albumForm"><label class="select" for="photos">Seleccionar fotos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple><div id="previews" class="previews" aria-live="polite"></div><label for="guestName">Tu nombre (opcional)</label><input id="guestName" type="text" maxlength="160" autocomplete="name"><button type="submit" disabled>Compartir fotos</button><p id="message" role="status">El álbum aún no está disponible.</p></form><p>¡Gracias por acompañarnos!</p><footer>Elisbe &amp; Hector<br><span>09 · 01 · 2027</span></footer></main><script src="../js/rsvp-config.js"></script><script src="album.bundle.js"></script></body></html>
