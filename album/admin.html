<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrar álbum | Elisbe &amp; Hector</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../admin/admin.css"><link rel="stylesheet" href="album.css"></head><body class="admin-page"><main class="admin-shell"><p><a href="../admin/">← Volver a invitados</a></p><section id="login" class="admin-card" hidden><h1>Administrar álbum</h1><form id="loginForm" class="form"><label for="email">Correo</label><input id="email" type="email" required autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"><button class="button">Ingresar</button></form></section><section id="panel" hidden><h1>Álbum de fotografías</h1><p id="notice" role="status"></p><div class="admin-grid"><section class="admin-card"><h2>Disponibilidad y cuota</h2><form id="settings" class="form"><label><input id="enabled" type="checkbox"> Habilitar el álbum</label><label for="opens">Apertura (hora local del dispositivo)</label><input id="opens" type="datetime-local" required><label for="closes">Cierre (hora local del dispositivo)</label><input id="closes" type="datetime-local" required><label for="quota">Cuota total en MB (1 MB = 1.000.000 bytes)</label><input id="quota" type="number" min="2.097152" step="0.000001" required><button class="button">Guardar configuración</button></form><button id="cleanup" class="button outline" type="button">Limpiar cargas interrumpidas</button></section><section class="admin-card"><h2>Enlace y código QR</h2><label for="albumUrl">Dirección pública del álbum</label><input id="albumUrl" type="url" required><p>Comprueba la dirección definitiva antes de imprimir el QR.</p><button id="makeQr" class="button" type="button">Generar QR</button><canvas id="qr" aria-label="Código QR del álbum"></canvas><p><a id="downloadQr" download="album-qr.png" hidden>Descargar QR</a></p></section></div><section class="admin-card"><h2>Fotos recibidas</h2><p>Las fotos son privadas y solo están disponibles para administración.</p><button id="refresh" class="button outline" type="button">Actualizar</button> <button id="zip" class="button outline" type="button">Descargar fotos cargadas en ZIP</button><div id="photosList" class="family-list"></div><button id="more" class="button outline" type="button" hidden>Cargar más</button></section></section></main><script src="../js/rsvp-config.js"></script><script src="../js/rsvp-client.js"></script><script src="admin.bundle.js"></script></body></html>
